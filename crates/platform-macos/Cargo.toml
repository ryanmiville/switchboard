[package]
name = "switchboard-macos"
description = "Switchboard's platform traits, implemented for macOS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
switchboard-core.workspace = true
# Browser discovery reads Info.plist files, which works (and is tested) on every platform.
plist = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = { version = "0.3.2", features = ["objc2-core-services", "libc"] }
objc2-core-services = "0.3.2"
objc2-service-management = { version = "0.3.2", features = ["SMAppService"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
