[package]
name = "switchboard-app"
description = "The Switchboard app: Rune settings window and Quick Switch picker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "switchboard-rs-app"
path = "src/main.rs"

[dependencies]
switchboard-core.workspace = true
rune.workspace = true
rune-kit.workspace = true
tempfile.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
switchboard-macos.workspace = true

[target.'cfg(not(target_os = "macos"))'.dependencies]
switchboard-linux = { workspace = true, features = ["tray"] }

[target.'cfg(not(target_os = "macos"))'.dev-dependencies]
switchboard-linux.workspace = true

[dev-dependencies]
png = "0.17"
tempfile.workspace = true

[lints]
workspace = true
