name: Verify

on:
  push:
    branches: [main, swift-next]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .build
          scripts/check 2>&1 | tee .build/verify.log
      - name: Bundle the app
        run: scripts/bundle --debug
      - name: Render a scene from the bundled app
        run: '".build/bundle/Switchboard Next.app/Contents/MacOS/Switchboard" --snap .build/snapshots/app-routing.png --scene routing'
      # The scene renders from the UI tests and the app, for review; goldens are compared only on request.
      - name: Upload scene renders
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scene-renders
          path: .build/snapshots
          if-no-files-found: ignore
      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verification-log
          path: .build/verify.log

  # The Linux subset that cloud sessions run, set up by the same script they use.
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Cloud setup script
        run: sudo scripts/cloud-setup.sh
      - name: Check
        shell: bash
        run: |
          . /etc/profile.d/switchboard-dev.sh
          scripts/check
