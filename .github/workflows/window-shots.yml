name: Window shots (prototype)

# Prototype: shows scenes in the real settings window on the runner's screen and captures them,
# to see whether CI can take whole-window screenshots (sidebar and toolbar included).
on:
  push:
    branches: [claude/project-thread-i349f3]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shots:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Bundle the app
        run: scripts/bundle --debug
      - name: Describe the screen
        run: |
          system_profiler SPDisplaysDataType || true
          sw_vers
      - name: Shoot scenes
        shell: bash
        run: |
          out=.build/shots
          mkdir -p "$out"
          home=$(mktemp -d); mkdir -p "$home/Applications"
          app=.build/bundle/Switchboard.app/Contents/MacOS/Switchboard
          failed=0
          scenes=$("$app" --list-scenes)
          for scene in $scenes routing; do
            for theme in light dark; do
              # The second routing pass checks that two shots of the same scene match exactly.
              if [ -f "$out/$scene-$theme.png" ]; then mv "$out/$scene-$theme.png" "$out/$scene-$theme-first.png"; fi
              HOME="$home" SWITCHBOARD_APPLICATIONS="$home/Applications" \
                "$app" --shoot "$out/$scene-$theme.png" --scene "$scene" --theme "$theme" > "$out/$scene-$theme.log" 2>&1 &
              pid=$!
              wid=""
              for _ in $(seq 60); do
                wid=$(sed -n 's/^window \([0-9]*\).*/\1/p' "$out/$scene-$theme.log")
                [ -n "$wid" ] && break
                kill -0 $pid 2>/dev/null || break
                sleep 0.5
              done
              wait $pid || failed=1
              cat "$out/$scene-$theme.log"
            done
          done
          for theme in light dark; do
            if cmp -s "$out/routing-$theme.png" "$out/routing-$theme-first.png"; then
              echo "routing-$theme: two shots are identical"
            else
              echo "routing-$theme: two shots differ"
            fi
          done
          ls -la "$out"
          exit $failed
      - name: Upload shots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: window-shots
          path: .build/shots
          if-no-files-found: ignore
