name: Check

on:
  push:
    branches: [main, rune-rewrite]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXTEST_PROFILE: ci
      # Golden renders run on Mesa's software Vulkan.
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends clang pkg-config libfontconfig1-dev \
            libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libvulkan1 mesa-vulkan-drivers
      - name: Rust (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: cargo-nextest
        run: curl -sSfL --proto '=https' https://get.nexte.st/latest/linux | tar zxf - -C "$HOME/.cargo/bin"
      - name: Check
        run: scripts/check
      - name: Upload golden renders that didn't match
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-actual
          path: target/golden-actual/
          if-no-files-found: ignore

  macos:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Rust (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Clippy and tests (image goldens run on Linux only)
        run: |
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
