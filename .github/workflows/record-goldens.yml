name: Record goldens

# Re-records scene goldens on CI's runner and commits them to the branch it runs on. Run it after
# a change that is meant to change how scenes look: from the Actions tab ("Run workflow"), or
# `gh workflow run record-goldens.yml --ref <branch> -f scenes=routing,picker`. Look at the
# renders first: the Verify run's scene-renders artifact has them, with -diff images.

on:
  workflow_dispatch:
    inputs:
      scenes:
        description: "Scenes to re-record, comma-separated (empty for every scene)"
        required: false
        default: ""

permissions:
  contents: write
  # To start Verify on the commit it pushes (see the last step).
  actions: write

concurrency:
  group: record-goldens-${{ github.ref }}
  cancel-in-progress: false

jobs:
  record:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
      SCENES: ${{ inputs.scenes }}
    steps:
      - uses: actions/checkout@v6
      # GitHub starts manual workflows only from a file on the default branch, so this file is on
      # main too; it runs the chosen branch's code, which needs scene goldens to record.
      - name: Check the branch and the scene names
        shell: bash
        run: |
          [[ -d Tests/UITests/Goldens ]] || { echo "This branch has no scene goldens (Tests/UITests/Goldens)." >&2; exit 2; }
          [[ "$SCENES" =~ ^[a-z0-9,\ -]*$ ]] || { echo "Scenes are lowercase names separated by commas." >&2; exit 2; }
      - name: Bundle the app
        run: scripts/bundle --debug
      - name: Record
        shell: bash
        run: SHOT_DIR=.build/snapshots SHOT_RECORD="${SCENES:-1}" scripts/shoot $(echo "$SCENES" | tr ',' ' ')
      # Shooting again and comparing proves the new goldens are stable on this runner.
      - name: Compare with what was just recorded
        shell: bash
        run: SHOT_DIR=.build/snapshots/again SHOT_COMPARE=1 scripts/shoot $(echo "$SCENES" | tr ',' ' ')
      - name: Commit changed goldens
        shell: bash
        run: |
          git add Tests/UITests/Goldens
          if git diff --cached --quiet; then
            echo "No golden changed."
            exit 0
          fi
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ui: record scene goldens on CI (${SCENES:-every scene})"
          # Someone may have pushed while this ran. Replay on top of it; where both changed a
          # golden, keep the one just recorded here (-X theirs is the commit being replayed).
          for attempt in 1 2 3; do
            if git pull --rebase -X theirs origin "$GITHUB_REF_NAME" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "PUSHED=1" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "Couldn't push the recorded goldens; they are in the recorded-goldens artifact." >&2
          exit 1
      # A push made with this workflow's token starts a pull_request run that GitHub holds for a
      # maintainer's approval. A run started on request with the same token isn't held, so start
      # Verify on the branch here: its checks land on the pushed commit and nobody has to approve.
      - name: Verify the pushed goldens
        if: env.PUSHED == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run verify.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
      - name: Upload the recorded goldens
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: recorded-goldens
          path: |
            Tests/UITests/Goldens
            .build/snapshots
          if-no-files-found: ignore
